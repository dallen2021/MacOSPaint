name: Xcode App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-native-app:
    name: Xcode 26 / arm64
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Report toolchain
        run: xcodebuild -version

      - name: Build unsigned application
        run: |
          xcodebuild \
            -project MacOSPaint.xcodeproj \
            -scheme MacOSPaint \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
