name: Xcode App

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build-native-app:
    name: Xcode 26 / arm64
    runs-on: macos-26
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Report toolchain
        run: xcodebuild -version

      - name: Build unsigned application
        run: |
          xcodebuild \
            -project MacOSPaint.xcodeproj \
            -scheme MacOSPaint \
            -configuration Debug \
            -destination 'platform=macOS,arch=arm64' \
            CODE_SIGNING_ALLOWED=NO \
            build
